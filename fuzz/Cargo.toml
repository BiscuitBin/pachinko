[package]
name = "libpachinko-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.99"

[package.metadata]
cargo-fuzz = true

[dependencies]
# Decision 0007: libFuzzer drives arbitrary bytes into the smoke target. This
# unpublished crate is outside the workspace and pinned by fuzz/Cargo.lock.
libfuzzer-sys = "0.4.13"
libpachinko = { path = "../crates/libpachinko" }

# An excluded crate cannot inherit the workspace's forbid levels.
[lints.rust]
unsafe_code = "forbid"
non_ascii_idents = "forbid"

# Invariant 6 also applies outside the workspace. Keep these levels aligned with
# [workspace.lints.clippy] in Cargo.toml; excluded packages cannot inherit them.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
missing_const_for_fn = "warn"
use_self = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unreachable = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
exhaustive_enums = "warn"
exhaustive_structs = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
tests_outside_test_module = "warn"
mod_module_files = "warn"
iter_over_hash_type = "warn"
str_to_string = "warn"
lossy_float_literal = "warn"
float_cmp_const = "warn"
same_name_method = "warn"
cognitive_complexity = "warn"
multiple_crate_versions = "allow"

[[bin]]
name = "smoke"
path = "fuzz_targets/smoke.rs"
test = false
doc = false
bench = false
