<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 300" width="830" height="300" role="img" aria-labelledby="title desc">
<title id="title">Two orders: one lease end, one tick</title>
<desc id="desc">Two orders: one the specification states, one the double picks. One lease end (N25, N29), stated by the HeldRecordsOldestFirst guarantee since 2026-11-24: end_lease sends Freed for the held records smallest position first, so any entries that one end creates are added to the shed queues in that order; in S091 the superseded queue gains z then b, and the dead letters y then a, the reverse of key order. One tick (N34), where the specification gives no order and the double picks one: the due lapses run smallest expires_at first, equal ones in the order the leases were granted; then each due superseded record, in the queue&#x27;s order; then each due dead letter, in the queue&#x27;s order; each lapse and each decay is its own checked outcome.</desc>
<style>
svg { --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --line: #d1d9e0; --box: #f6f8fa; --info: #ddf4ff; --ok: #dafbe1; --warn: #fff8c5; --bad: #ffebe9; --accent: #0969da; --g1: #8250df; --g2: #bf8700; --g3: #0969da; --g4: #1a7f37; }
@media (prefers-color-scheme: dark) { svg { --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --line: #3d444d; --box: #151b23; --info: #0c2d6b; --ok: #0f3d1d; --warn: #3b2e00; --bad: #5d0f12; --accent: #4493f8; --g1: #ab7df8; --g2: #d29922; --g3: #4493f8; --g4: #3fb950; } }
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: var(--fg); }
text.muted { fill: var(--muted); }
text.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.bg { fill: var(--bg); }
.lane { stroke: var(--line); stroke-width: 1; fill: none; }
.edge { fill: none; stroke: var(--fg); stroke-width: 1.4; }
.edge.accent { stroke: var(--accent); }
.edge.dash { stroke-dasharray: 5 4; }
.head { fill: var(--fg); } .head.accent { fill: var(--accent); }
.box { stroke: var(--line); stroke-width: 1.2; }
.box.dash { stroke-dasharray: 5 4; }
.box.plain { fill: var(--box); } .box.info { fill: var(--info); } .box.ok { fill: var(--ok); }
.box.warn { fill: var(--warn); } .box.bad { fill: var(--bad); } .box.none { fill: var(--bg); }
.dot { fill: var(--fg); } .ring { fill: none; stroke: var(--accent); stroke-width: 1.6; }
.g1 { fill: var(--g1); } .g2 { fill: var(--g2); } .g3 { fill: var(--g3); } .g4 { fill: var(--g4); }
.s1 { stroke: var(--g1); } .s2 { stroke: var(--g2); } .s3 { stroke: var(--g3); } .s4 { stroke: var(--g4); }
</style>
<rect width="830" height="300" rx="8" class="bg"/>
<text x="10" y="16" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="600">One lease end (N25, N29): the specification&#x27;s order, HeldRecordsOldestFirst</text>
<text x="10" y="36" font-size="10.5" text-anchor="start" dominant-baseline="middle" class="muted">end_lease sends Freed smallest held position first; any entries the end creates are added in that order</text>
<rect x="10" y="52" width="150" height="34" rx="6" class="box info"/>
<text x="85.0" y="69.0" font-size="11" text-anchor="middle" dominant-baseline="middle"><tspan x="85.0" dy="-6.875">held records</tspan><tspan x="85.0" dy="13.75">by position</tspan></text>
<line x1="162" y1="69" x2="198" y2="69" class="edge"/>
<polygon points="198.0,69.0 190.0,65.0 190.0,73.0" class="head"/>
<rect x="200" y="52" width="120" height="34" rx="6" class="box plain"/>
<text x="260.0" y="69.0" font-size="11" text-anchor="middle" dominant-baseline="middle">Freed, Freed, …</text>
<line x1="322" y1="62" x2="360" y2="52" class="edge"/>
<polygon points="360.0,52.0 351.2,50.2 353.3,57.9" class="head"/>
<line x1="322" y1="76" x2="360" y2="96" class="edge"/>
<polygon points="360.0,96.0 354.8,88.7 351.1,95.8" class="head"/>
<text x="370" y="52" font-size="11" text-anchor="start" dominant-baseline="middle">superseded queue (S091):</text>
<rect x="530" y="40" width="36" height="24" rx="6" class="box warn"/>
<text x="548.0" y="52.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="600">z</text>
<rect x="570" y="40" width="36" height="24" rx="6" class="box warn"/>
<text x="588.0" y="52.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="600">b</text>
<text x="616" y="52" font-size="10.5" text-anchor="start" dominant-baseline="middle" class="muted">key order: b, z</text>
<text x="370" y="96" font-size="11" text-anchor="start" dominant-baseline="middle">dead letters (S091):</text>
<rect x="530" y="84" width="36" height="24" rx="6" class="box bad"/>
<text x="548.0" y="96.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="600">y</text>
<rect x="570" y="84" width="36" height="24" rx="6" class="box bad"/>
<text x="588.0" y="96.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="600">a</text>
<text x="616" y="96" font-size="10.5" text-anchor="start" dominant-baseline="middle" class="muted">key order: a, y</text>
<line x1="10" y1="132" x2="820" y2="132" class="lane"/>
<text x="10" y="152" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="600">One tick (N34): the double&#x27;s choice</text>
<text x="10" y="172" font-size="10.5" text-anchor="start" dominant-baseline="middle" class="muted">read the clock once; each lapse and each decay is its own checked outcome</text>
<rect x="10" y="188" width="250" height="66" rx="6" class="box info"/>
<text x="22" y="206" font-size="11.5" text-anchor="start" dominant-baseline="middle" font-weight="600">1. due lapses</text>
<text x="22" y="234" font-size="10.5" text-anchor="start" dominant-baseline="middle" class="muted"><tspan x="22" dy="-6.5625">smallest expires_at first;</tspan><tspan x="22" dy="13.125">ties in grant order</tspan></text>
<line x1="262" y1="221" x2="283" y2="221" class="edge"/>
<polygon points="283.0,221.0 275.0,217.0 275.0,225.0" class="head"/>
<rect x="285" y="188" width="250" height="66" rx="6" class="box warn"/>
<text x="297" y="206" font-size="11.5" text-anchor="start" dominant-baseline="middle" font-weight="600">2. due superseded records</text>
<text x="297" y="234" font-size="10.5" text-anchor="start" dominant-baseline="middle" class="muted"><tspan x="297" dy="-6.5625">in the queue&#x27;s order</tspan><tspan x="297" dy="13.125">(as the entries were added)</tspan></text>
<line x1="537" y1="221" x2="558" y2="221" class="edge"/>
<polygon points="558.0,221.0 550.0,217.0 550.0,225.0" class="head"/>
<rect x="560" y="188" width="250" height="66" rx="6" class="box bad"/>
<text x="572" y="206" font-size="11.5" text-anchor="start" dominant-baseline="middle" font-weight="600">3. due dead letters</text>
<text x="572" y="234" font-size="10.5" text-anchor="start" dominant-baseline="middle" class="muted"><tspan x="572" dy="-6.5625">in the queue&#x27;s order</tspan><tspan x="572" dy="13.125">(as the entries were added)</tspan></text>
<text x="10" y="276" font-size="10" text-anchor="start" dominant-baseline="middle" class="muted">The decays read the state the lapses left (N35). The order shows only in the report and in the order two lapses&#x27; Freed add entries.</text>
</svg>
