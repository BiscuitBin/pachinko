# The Gleam double of docs/specs/pachinko.allium. Decision 0021 records every
# package below; none is added without amending it. The ranges are pinned by
# manifest.toml, which only `gleam` writes: `just gleam-double-deps` fetches
# what it pins, and both recipes fail if a run rewrites it.
name = "pachinko_double"
version = "0.1.0"
description = "A double of the pachinko domain: a pure core behind one owner actor."
target = "erlang"
gleam = ">= 1.19.0"

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"

# For the tests' file reads alone: the coverage check reads the scenario
# catalog and the specification.
[dev-dependencies]
simplifile = ">= 2.7.0 and < 3.0.0"
