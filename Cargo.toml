[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fuzz"]

# Decision 0007: divan times the smoke benchmark, as a development dependency
# only. It is outside consumer and cargo-deny graphs; MSRV 1.80 is below our pin.
[workspace.dependencies]
divan = "0.1.21"

[workspace.package]
edition = "2024"
# The toolchain pin's major.minor (rust-toolchain.toml); it follows the pin until a
# crate is first published.
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/BiscuitBin/pachinko"
homepage = "https://github.com/BiscuitBin/pachinko"
authors = ["Steven Cutting"]
# Neither crate goes to crates.io; decision 0016 defines GitHub Releases.
publish = false

[workspace.metadata.release]
allow-branch = ["main", "release/*"]
# Keep crate/version placeholders available even when a dependent is updated.
consolidate-commits = false
pre-release-commit-message = "Release {{crate_name}} {{version}}"
tag-message = "Release {{crate_name}} {{version}}"
publish = false
push = false

# Every level here is `warn` so a local build never breaks mid-edit; `just clippy`
# passes `-D warnings`, which is where a warning becomes a failure. The `forbid` and
# `deny` entries are the exceptions, each saying why it cannot wait for the gate, and
# the one `allow` at the end turns a lint off.
[workspace.lints.rust]
# Invariant 4: no unsafe code in any crate. `forbid`, so no attribute can lower it.
unsafe_code = "forbid"
# Identifiers stay ASCII so every name can be typed and searched; `forbid` because no
# crate here has a reason to need an exception.
non_ascii_idents = "forbid"
# Every public item is documented; `just doc` builds the API reference from it.
missing_docs = "warn"
# Invariant 3: public types are `Debug`.
missing_debug_implementations = "warn"
# A group, so `priority = -1` lets a single lint inside it be set apart.
rust_2018_idioms = { level = "warn", priority = -1 }
# The public surface is what invariant 3 governs, so it is stated, never accidental:
# no `pub` item that cannot be reached, no reachable type that cannot be named.
unreachable_pub = "warn"
unnameable_types = "warn"
# Noise a reader has to see through: a path longer than it needs to be, a cast where
# a coercion would do, a numeric cast to the type the value already has.
unused_qualifications = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.rustdoc]
# A link that does not resolve, or resolves to a private item, is a broken page in
# the API reference. Rustdoc lints run only under `cargo doc`; `deny` makes a plain
# `cargo doc` fail, not only `just doc` with its `-D warnings`.
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
# Each crate's front page says what the crate is for.
missing_crate_level_docs = "warn"
# A stray backtick silently mangles the rendered page.
unescaped_backticks = "warn"

[workspace.lints.clippy]
# Groups take `priority = -1` so the single lints below override their members.
pedantic = { level = "warn", priority = -1 }
# The cargo group checks the package manifests; each crate's Cargo.toml says which of
# its fields serve it.
cargo = { level = "warn", priority = -1 }
# Nursery lints, enabled one by one because the nursery group is not stable enough
# to take whole: a function that can be `const` is, and a type names itself `Self`.
missing_const_for_fn = "warn"
use_self = "warn"
# Restriction lints from here to cognitive_complexity; that group is never enabled
# whole, so each is named. The panicking shortcuts: library and service code returns errors instead.
# clippy.toml lifts unwrap_used, expect_used and panic in test code; unreachable,
# todo and unimplemented have no test exemption and stay in force there.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unreachable = "warn"
todo = "warn"
unimplemented = "warn"
# No debugging output left behind, and no printing from library code: `run()` takes
# a writer, and only `main.rs` touches stdout, through `std::io::stdout()`.
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
# Invariant 3: public enums and structs are `#[non_exhaustive]`.
exhaustive_enums = "warn"
exhaustive_structs = "warn"
# Invariant 6: a lint is silenced only by `#[expect(lint, reason = "...")]`, which
# fails once the lint stops firing, never by `allow`. The gate rejects an outer
# `#[allow]` and any `allow` without a reason; an inner
# `#![allow(..., reason = "...")]` passes both lints, so review enforces the
# invariant for that form.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# Layout: unit tests sit in a `#[cfg(test)]` module, and a module with children is
# `foo.rs` beside `foo/`, never `foo/mod.rs`. Under this rule clippy 1.99's
# restriction lint `definition_in_module_root`, which polices `mod.rs` contents, has
# nothing to police, so it is not enabled.
tests_outside_test_module = "warn"
mod_module_files = "warn"
# Determinism: iterating a hash container visits elements in an unspecified order.
# clippy.toml's `disallowed-types` bans the std hash containers outright.
iter_over_hash_type = "warn"
# `.to_owned()` says what `.to_string()` on a `&str` hides: a copy, not formatting.
str_to_string = "warn"
# Floating point: a literal that cannot be represented exactly, and an `==` against
# a float constant, are both silent precision bugs.
lossy_float_literal = "warn"
float_cmp_const = "warn"
# An inherent method and a trait method with the same name make a call ambiguous to
# a reader.
same_name_method = "warn"
# A function too tangled to review; clippy.toml sets the threshold.
cognitive_complexity = "warn"
# A cargo-group lint turned off: cargo-deny's bans.multiple-versions owns this check
# and shows which crates pull in each version, so the lint would only repeat it.
multiple_crate_versions = "allow"

# For the service binary: fat LTO and one codegen unit trade build time for a smaller,
# faster binary. Revisit when T13 measures the container image build.
[profile.release]
lto = "fat"
codegen-units = 1

# Kept from L: tests build with light optimisation and full debug info, so a suite
# that loops (a property test, once the specifications bring one) stays fast. At this
# size the build cost is negligible.
[profile.test]
opt-level = 1
