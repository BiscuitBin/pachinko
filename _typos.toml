# The only typos configuration. pyproject.toml carries no [tool.typos]: typos
# stops at the first configuration file it finds, and finds this one.

[files]
# Lockfiles and vendored reference carry hashes and names that look like
# typos; the environment and tool directories hold binaries.
extend-exclude = [
  "Cargo.lock",
  "pixi.lock",
  ".pixi/",
  ".tools/",
  "target/",
  "ai_tmp/",
  "allium-skill-reference/",
]

[default]
# Commit ids, short or full, such as T10's 097ede1, whose letters the checker
# would otherwise read as misspelt words ("ede" for "edge"). The pattern also
# exempts every all-hex word of seven letters or more, such as "defaced", so a
# misspelling made only of the letters a to f would pass.
extend-ignore-re = ['\b[0-9a-f]{7,40}\b']

[default.extend-words]
# "mis-" as a hyphenated prefix (mis-wired, mis-asserting) reads as the
# fragment "mis", which the checker's dictionary mistakes for "miss"/"mist".
mis = "mis"
# The tickets name "als" as the word this file once listed and now does not
# need; the checker's dictionary rewrites it to "also".
als = "als"
# The tickets and the handbook name "ede" as the word T10 once listed for commit
# 097ede1, which the pattern above now covers; the checker reads it as "edge".
ede = "ede"
