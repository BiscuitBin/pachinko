<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 360" width="730" height="360" role="img" aria-labelledby="title desc">
<title id="title">The six outcomes when a lease ends</title>
<desc id="desc">When a lease ends, by release or by lapse, each held record goes by its mark and by whether a newer version is deferred behind it. unsettled with nothing deferred: held version → nowhere, record → queued, same position (RequeueUnsettledRecord); unsettled with a newer version deferred: held version → superseded queue, newer version → queued at the held version's position (SupersedeUnsettledHeldVersion); acked with nothing deferred: held version → nowhere: consumed, record → removed (ConsumeAckedRecord); acked with a newer version deferred: held version → nowhere: consumed, newer version → queued at its arrival position (ConsumeAckedVersionQueueDeferred); nacked with nothing deferred: held version → dead letters, record → removed (DeadLetterNackedRecord); nacked with a newer version deferred: held version → dead letters, newer version → queued at its arrival position (DeadLetterNackedVersionQueueDeferred).</desc>
<style>
svg { --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --line: #d1d9e0; --box: #f6f8fa; --info: #ddf4ff; --ok: #dafbe1; --warn: #fff8c5; --bad: #ffebe9; --accent: #0969da; }
@media (prefers-color-scheme: dark) { svg { --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --line: #3d444d; --box: #151b23; --info: #0c2d6b; --ok: #0f3d1d; --warn: #3b2e00; --bad: #5d0f12; --accent: #4493f8; } }
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: var(--fg); }
text.muted { fill: var(--muted); }
.bg { fill: var(--bg); }
.lane { stroke: var(--line); stroke-width: 1; }
.edge { fill: none; stroke: var(--fg); stroke-width: 1.4; }
.edge.accent { stroke: var(--accent); }
.edge.dash { stroke-dasharray: 5 4; }
.head { fill: var(--fg); }
.head.accent { fill: var(--accent); }
.frame { fill: none; stroke: var(--fg); stroke-width: 1.4; }
.box { stroke: var(--line); stroke-width: 1.2; }
.box.dash { stroke-dasharray: 5 4; }
.box.plain { fill: var(--box); } .box.info { fill: var(--info); } .box.ok { fill: var(--ok); }
.box.warn { fill: var(--warn); } .box.bad { fill: var(--bad); } .box.none { fill: var(--bg); }
</style>
<rect width="730" height="360" rx="8" class="bg"/>
<text x="10" y="14" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="600"><tspan x="10" dy="0">When a lease ends, by release or by lapse, each held record:</tspan></text>
<text x="10" y="40" font-size="12" text-anchor="start" dominant-baseline="middle" class="muted"><tspan x="10" dy="0">mark</tspan></text>
<text x="260" y="40" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="600"><tspan x="260" dy="0">nothing deferred</tspan></text>
<text x="570" y="40" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="600"><tspan x="570" dy="0">a newer version deferred</tspan></text>
<text x="10" y="102" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="600"><tspan x="10" dy="0">unsettled</tspan></text>
<rect x="110" y="56" width="300" height="92" rx="6" class="box info"/>
<text x="120" y="72" font-size="12" text-anchor="start" dominant-baseline="middle" font-weight="600"><tspan x="120" dy="0">held version → nowhere</tspan></text>
<text x="120" y="92" font-size="12" text-anchor="start" dominant-baseline="middle"><tspan x="120" dy="0">record → queued, same position</tspan></text>
<text x="120" y="136" font-size="10.5" text-anchor="start" dominant-baseline="middle" class="muted"><tspan x="120" dy="0">RequeueUnsettledRecord</tspan></text>
<rect x="420" y="56" width="300" height="92" rx="6" class="box warn"/>
<text x="430" y="72" font-size="12" text-anchor="start" dominant-baseline="middle" font-weight="600"><tspan x="430" dy="0">held version → superseded queue</tspan></text>
<text x="430" y="92" font-size="12" text-anchor="start" dominant-baseline="middle"><tspan x="430" dy="0">newer version → queued at</tspan><tspan x="430" dy="15.6">the held version's position</tspan></text>
<text x="430" y="136" font-size="10.5" text-anchor="start" dominant-baseline="middle" class="muted"><tspan x="430" dy="0">SupersedeUnsettledHeldVersion</tspan></text>
<text x="10" y="202" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="600"><tspan x="10" dy="0">acked</tspan></text>
<rect x="110" y="156" width="300" height="92" rx="6" class="box ok"/>
<text x="120" y="172" font-size="12" text-anchor="start" dominant-baseline="middle" font-weight="600"><tspan x="120" dy="0">held version → nowhere: consumed</tspan></text>
<text x="120" y="192" font-size="12" text-anchor="start" dominant-baseline="middle"><tspan x="120" dy="0">record → removed</tspan></text>
<text x="120" y="236" font-size="10.5" text-anchor="start" dominant-baseline="middle" class="muted"><tspan x="120" dy="0">ConsumeAckedRecord</tspan></text>
<rect x="420" y="156" width="300" height="92" rx="6" class="box ok"/>
<text x="430" y="172" font-size="12" text-anchor="start" dominant-baseline="middle" font-weight="600"><tspan x="430" dy="0">held version → nowhere: consumed</tspan></text>
<text x="430" y="192" font-size="12" text-anchor="start" dominant-baseline="middle"><tspan x="430" dy="0">newer version → queued at</tspan><tspan x="430" dy="15.6">its arrival position</tspan></text>
<text x="430" y="236" font-size="10.5" text-anchor="start" dominant-baseline="middle" class="muted"><tspan x="430" dy="0">ConsumeAckedVersionQueueDeferred</tspan></text>
<text x="10" y="302" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="600"><tspan x="10" dy="0">nacked</tspan></text>
<rect x="110" y="256" width="300" height="92" rx="6" class="box bad"/>
<text x="120" y="272" font-size="12" text-anchor="start" dominant-baseline="middle" font-weight="600"><tspan x="120" dy="0">held version → dead letters</tspan></text>
<text x="120" y="292" font-size="12" text-anchor="start" dominant-baseline="middle"><tspan x="120" dy="0">record → removed</tspan></text>
<text x="120" y="336" font-size="10.5" text-anchor="start" dominant-baseline="middle" class="muted"><tspan x="120" dy="0">DeadLetterNackedRecord</tspan></text>
<rect x="420" y="256" width="300" height="92" rx="6" class="box bad"/>
<text x="430" y="272" font-size="12" text-anchor="start" dominant-baseline="middle" font-weight="600"><tspan x="430" dy="0">held version → dead letters</tspan></text>
<text x="430" y="292" font-size="12" text-anchor="start" dominant-baseline="middle"><tspan x="430" dy="0">newer version → queued at</tspan><tspan x="430" dy="15.6">its arrival position</tspan></text>
<text x="430" y="336" font-size="10.5" text-anchor="start" dominant-baseline="middle" class="muted"><tspan x="430" dy="0">DeadLetterNackedVersionQueueDeferred</tspan></text>
</svg>
