# Mutating counterpart to .pre-commit-config.yaml. Never installed as a hook;
# run it explicitly with `just fix`.
# pixi.lock is YAML, so without this line the builtin check-yaml would parse
# the whole lockfile on every commit.
exclude: >-
  (?x)^(
    \.git/|
    \.pixi/|
    ai_tmp/|
    target/|
    \.tools/|
    allium-skill-reference/|
    Cargo\.lock$|
    pixi\.lock$
  )
repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: rustfmt
        entry: cargo fmt --all
        language: system
        pass_filenames: false
        types: [rust]

      # `just fix` is the only caller, so .pixi/envs/default/bin is already on PATH here.
      - id: taplo-fmt
        name: taplo format
        entry: taplo fmt
        language: system
        types: [toml]

      - id: cargo-shear-fix
        name: Remove unused dependencies
        entry: cargo shear --fix
        language: system
        pass_filenames: false

  - repo: builtin
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: 341e2a331ba578029e66c2e01183e7a6b5ca9ab4 # v0.24.0
    hooks:
      - id: markdownlint-cli2
        name: markdownlint fix
        args: [--fix]
        # The config's globs are appended to the files prek passes, so each parallel
        # batch would fix every Markdown file at once and the racing writes corrupt or
        # empty them. One process, given the globs alone, fixes each file once.
        pass_filenames: false
