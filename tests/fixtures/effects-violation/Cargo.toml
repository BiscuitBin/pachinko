# The probe scripts/check-effects.sh runs gate 8 against: a crate that breaks every
# ban exactly once. It is not a member of the repository's workspace; the empty
# [workspace] table makes it its own root, so `cargo tree` and `cargo clippy` walk it
# with `--manifest-path`, offline, against its own committed Cargo.lock.
[package]
name = "effects-violation"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

# Every banned crate but socket2 directly, and socket2 only through wrapper. Each is a
# path-dependency stub under deps/, so nothing is fetched.
[dependencies]
async-std = { path = "deps/async-std" }
getrandom = { path = "deps/getrandom" }
mio = { path = "deps/mio" }
rand = { path = "deps/rand" }
rand_core = { path = "deps/rand_core" }
smol = { path = "deps/smol" }
tokio = { path = "deps/tokio" }
wrapper = { path = "deps/wrapper" }
