[graph]
# Every feature is on, so a dependency behind a feature is checked too.
all-features = true
# Dev-dependencies are outside the graph: they serve the tests only, and the
# licences and bans below are about what ships, not the test harness.
exclude-dev = true
# The three hosts the workspace is built on; a target-specific dependency for any
# other platform is out of scope.
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin", "x86_64-pc-windows-msvc"]

# Network: the RustSec database is fetched, so this section runs from `just audit`,
# never `just check`.
[advisories]
# Stricter than cargo-deny's default of `warn`: a yanked release is one its publisher
# withdrew, so a lock that pins it is a defect to fix, not a warning to read past.
yanked = "deny"
# Unmaintained-crate advisories fail only for direct dependencies of the workspace,
# which are the ones this repository can replace.
unmaintained = "workspace"
ignore = []

# Permissive licences only, all compatible with Apache-2.0. A licence on this list
# that no dependency uses yet is expected and only warned about; the list is not
# trimmed to silence it.
[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unicode-3.0",
  "Unlicense",
  "CC0-1.0",
]
# A licence text detected with less confidence than this is reported, not guessed.
confidence-threshold = 0.9
# The workspace's own crates are `publish = false`, so the check skips them; it is
# about dependencies.
private = { ignore = true }

# No effect-crate bans here: `wrappers` names direct parents only, so it cannot
# scope a ban to libpachinko, and a workspace-wide ban would reject the service's
# own transitives (CONVENTIONS.md §1 fact 3). `just effects` walks libpachinko's tree.
[bans]
# Duplicates are reported but tolerated: the ecosystem cannot always agree on one
# version. This check replaces clippy's multiple_crate_versions.
multiple-versions = "warn"
# A `*` requirement makes the build depend on whatever is newest.
wildcards = "deny"
# A duplicate's graph shows both the path to the lowest version and the simplest path.
highlight = "all"
deny = [{ crate = "openssl-sys", reason = "no native TLS anywhere in this workspace" }]

# Crates come from crates.io and nowhere else; a git source is added deliberately.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
