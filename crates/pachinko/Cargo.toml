[package]
name = "pachinko"
version = "0.1.0"
# description, keywords, categories and readme are the metadata the clippy cargo
# group's cargo_common_metadata names. It skips a `publish = false` package, so they
# are kept for the docs and for the day publishing is decided.
description = "The pachinko service: a minimal binary that supplies libpachinko's effects."
keywords = ["pachinko", "service", "binary"]
categories = ["command-line-utilities"]
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Invariant 5: the service depends on the library, never the reverse. Without the
# version beside the path, deny.toml's `wildcards = "deny"` rejects the dependency.
libpachinko = { path = "../libpachinko", version = "0.1.0" }
# The Arrow record store (decision-0007 notes in the workspace manifest).
arrow-array = { workspace = true }
arrow-ord = { workspace = true }
arrow-schema = { workspace = true }
arrow-select = { workspace = true }
# The Flight API and its runtime (decision 0019; notes in the workspace manifest).
arrow-flight = { workspace = true }
arrow-ipc = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }

[dev-dependencies]
# The records contract the Arrow store's test runs, from libpachinko's `testing`
# feature; development only, so no normal build of the service turns it on.
divan = { workspace = true }
libpachinko = { path = "../libpachinko", version = "0.1.0", features = ["testing"] }

[[bench]]
name = "arrow"
harness = false

# The same `--cfg docsrs` and features `just doc` builds with, so a docs.rs build
# would match the gate.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]

[package.metadata.release]
tag-prefix = "pachinko-"
pre-release-replacements = [
  { file = "../../CHANGELOG.md", search = "(?m)^## pachinko \\[Unreleased\\]\\[pachinko-unreleased\\]\n", replace = "## pachinko [Unreleased][pachinko-unreleased]\n\n## pachinko [{{version}}][pachinko-{{version}}] - {{date}}\n", exactly = 1 },
  { file = "../../CHANGELOG.md", search = "(?m)^\\[pachinko-unreleased\\]: .*", replace = "[pachinko-unreleased]: {{repository}}/compare/pachinko-v{{version}}...HEAD\n[pachinko-{{version}}]: {{repository}}/releases/tag/pachinko-v{{version}}", exactly = 1 },
]
