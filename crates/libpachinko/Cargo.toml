[package]
name = "libpachinko"
version = "0.1.0"
# description, keywords, categories and readme are the metadata the clippy cargo
# group's cargo_common_metadata names. It skips a `publish = false` package, so they
# are kept for the docs and for the day publishing is decided.
description = "The pachinko library: the domain its specifications define, with every effect behind a trait."
keywords = ["pachinko", "library", "specification"]
categories = ["development-tools"]
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

# The same `--cfg docsrs` and features `just doc` builds with, so a docs.rs build
# would match the gate.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]

[package.metadata.release]
tag-prefix = "libpachinko-"
pre-release-replacements = [
  { file = "../../CHANGELOG.md", search = "(?m)^## libpachinko \\[Unreleased\\]\\[libpachinko-unreleased\\]\n", replace = "## libpachinko [Unreleased][libpachinko-unreleased]\n\n## libpachinko [{{version}}][libpachinko-{{version}}] - {{date}}\n", exactly = 1 },
  { file = "../../CHANGELOG.md", search = "(?m)^\\[libpachinko-unreleased\\]: .*", replace = "[libpachinko-unreleased]: {{repository}}/compare/libpachinko-v{{version}}...HEAD\n[libpachinko-{{version}}]: {{repository}}/releases/tag/libpachinko-v{{version}}", exactly = 1 },
]

[dev-dependencies]
divan = { workspace = true }

[[bench]]
name = "version"
harness = false
