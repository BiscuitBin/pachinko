# Tighter than clippy's defaults (25, 100 and 7; excessive_nesting does nothing until
# a threshold is set): a function past one of them is split, not excused.
# cognitive_complexity is a restriction lint, enabled in Cargo.toml.
cognitive-complexity-threshold = 15
excessive-nesting-threshold = 4
too-many-lines-threshold = 60
too-many-arguments-threshold = 5

# Every stable function of std::fs, std::env and std::process; the clock and thread
# calls CONVENTIONS.md §9 names, with sleep_ms beside sleep and park_timeout, a sleep
# by another name; and the paths outside those modules that reach the same effects:
# the filesystem queries on Path (PathBuf reaches them through Deref),
# std::path::absolute, which reads the current directory, std::os::unix::fs, DNS
# through ToSocketAddrs, the core count through available_parallelism, and the
# parent process through std::os::unix::process::parent_id.
disallowed-methods = [
  { path = "std::time::SystemTime::now", reason = "effect: the clock is reached through a trait libpachinko defines (decision 0008)" },
  { path = "std::time::SystemTime::elapsed", reason = "effect: the clock is reached through a trait libpachinko defines (decision 0008)" },
