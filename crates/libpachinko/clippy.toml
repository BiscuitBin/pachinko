# libpachinko's clippy configuration. Clippy reads the first clippy.toml it finds
# walking up from a crate's manifest directory and merges nothing, so this file
# shadows the root one for libpachinko: it restates every line of the root
# clippy.toml verbatim, and scripts/check-effects.sh fails if the two differ by more
# than the effect entries. Change the root file first, then mirror it here.
#
# The effect entries are gate 8's std-API bans (decision 0008, CONVENTIONS.md §9):
# every reason begins `effect:`, which is how the script finds them, and the fixture
# under tests/fixtures/effects-violation breaks each exactly once. A path in these
# lists that does not resolve is only a warning, so the fixture is what proves each
# entry is live. A type entry also bans the type's associated functions and
# constants (`File::open`, `ExitCode::SUCCESS`). Only unix paths are listed:
# another platform's path does not resolve here.
#
# The `-in-tests` keys lift unwrap_used, expect_used, panic, dbg_macro, print_stdout,
# print_stderr and indexing_slicing in `#[test]` functions and `#[cfg(test)]` code: a
# failing test should panic loudly, and a test may index and print freely. The
# workspace table does not enable indexing_slicing, so its key is ready for a crate
# that does. Clippy has no such key for unreachable, todo or unimplemented.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
allow-dbg-in-tests = true
allow-print-in-tests = true
# Iteration over these is in an unspecified order, so anything built from it can
